<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111111">
  <title>{% if page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.data.profile.name }} — Systems &amp; Security</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.data.profile.name }} — Systems &amp; Security">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/dm-sans.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/jetbrains-mono.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  {% if page.title == 'Home' %}<script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>{% endif %}
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="masthead">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Zihou Ren, home">ZR<span aria-hidden="true"> /</span></a>
      <span>Systems, security &amp; the things between.</span>
      <a class="masthead-link" href="{{ site.data.profile.github }}">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    {{ content }}
    <footer class="footer">
      <span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</span>
      <span>Built with curiosity.</span>
      <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </div>
</body>
</html>
