title: "Zihou Ren"
url: "https://renzihou.github.io"
baseurl: ""
timezone: Asia/Shanghai

markdown: kramdown
plugins:
  - jekyll-email-protect

collections:
  - publications
  - news
  - showcase
  - posts

# Keep documentation, development files, and unused pages out of the public site.
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - blog.html
  - publications.html
  - showcase.html
